name: Publier les plannings

on:
  push:
    branches: [main]
    paths:
      - 'plannings/**'
      - 'src/**'
      - 'site/**'
      - 'config/**'
      - 'test/**'
      - 'depot/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publier.yml'
  workflow_dispatch:
    inputs:
      fichier:
        description: 'Nom du fichier à retraiter dans plannings/ (laisser vide pour retraiter tous les plannings)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# Plusieurs dépôts rapprochés sont mis en file et traités l'un après l'autre, sans annulation
# (sans « queue: max », GitHub ne garde qu'une exécution en attente et annule les autres).
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url || steps.deploiement2.outputs.page_url }}
    steps:
      # Toujours l'état le plus récent de main (y compris les fichiers générés par l'exécution précédente),
      # pas le commit qui a déclenché l'exécution.
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Convertir les plannings
        id: conversion
        continue-on-error: true
        env:
          EVENEMENT: ${{ github.event_name }}
          AVANT: ${{ github.event.before }}
          FICHIER: ${{ inputs.fichier }}
        run: |
          if [ "$EVENEMENT" = "workflow_dispatch" ]; then
            if [ -n "$FICHIER" ]; then
              node src/process.js --file "$FICHIER"
            else
              node src/process.js --all
            fi
          else
            node src/process.js --pending "$AVANT"
          fi

      # Le commit du bot passe par GITHUB_TOKEN : il ne redéclenche pas ce workflow.
      - name: Enregistrer les fichiers générés
        env:
          MOIS: ${{ steps.conversion.outputs.months }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public data
          if git diff --cached --quiet; then
            echo "Aucun fichier généré à enregistrer."
            exit 0
          fi
          if [ -n "$MOIS" ]; then
            git commit -m "Planning $MOIS généré"
          else
            git commit -m "Page des plannings régénérée"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      # GitHub ne retrouve parfois pas l'archive juste après son envoi : un second essai suffit.
      - name: Publier sur GitHub Pages
        id: deploiement
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Patienter avant un nouvel essai
        if: steps.deploiement.outcome == 'failure'
        run: sleep 20

      - name: Publier sur GitHub Pages (nouvel essai)
        id: deploiement2
        if: steps.deploiement.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Signaler les plannings en erreur
        if: steps.conversion.outcome == 'failure'
        run: |
          echo "::error::Au moins un planning n’a pas pu être converti. Le détail est dans le résumé de cette exécution."
          exit 1
